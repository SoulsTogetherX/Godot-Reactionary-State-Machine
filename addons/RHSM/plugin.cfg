[plugin]

name="Reactionary Hierarchical State Machine"
description="A lightweight and efficiency Hierarchical State Machine, used for general purposes, with a built-in blackboard context node.

Relies on togglable signals, valeu changed signals, and processing methods. Complexity is removed, but not at the cost of functionality. Only what is needed, at any one time, will run when a state is called."
author="Xavier Alvarez"
version="1.0.0"
script="RHSM.gd"
